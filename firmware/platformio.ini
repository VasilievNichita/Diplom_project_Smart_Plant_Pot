[platformio]
default_envs = monitor

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -Wall -Wextra

; Safe default: real measurements, no command claims and no pump output.
[env:monitor]
build_src_filter = +<*> -<bench.cpp>
build_flags = ${env.build_flags} -DFOLIUM_PUMPS_ENABLED=0

; Explicitly selected only after wiring and fault tests.
[env:irrigation]
build_src_filter = +<*> -<bench.cpp>
build_flags = ${env.build_flags} -DFOLIUM_PUMPS_ENABLED=1

; Offline measurement into a graduated vessel, never into a plant.
[env:pump-test]
build_src_filter = +<pump.cpp> +<bench.cpp>
build_flags = ${env.build_flags} -DFOLIUM_PUMPS_ENABLED=1 -DFOLIUM_BENCH=1
